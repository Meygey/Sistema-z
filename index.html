<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Z | Bóveda Sincronizada Omotichi</title>
    <style>
        body {
            background-color: #030303;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        header {
            border-bottom: 2px solid #ff0000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff0000;
            font-size: 24px;
            margin: 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 12px;
        }
        .card {
            background: #0a0a0a;
            border: 1px solid #ff0000;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.2);
        }
        .card h3 {
            color: #ff2222;
            margin-top: 0;
            font-size: 16px;
            text-align: center;
        }
        audio {
            width: 100%;
            border-radius: 6px;
            margin-top: 8px;
        }
        .badge {
            display: inline-block;
            background: #220000;
            color: #ff4444;
            border: 1px solid #ff0000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .track-item {
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .track-header {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .track-cover {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ff0000;
        }
        .track-info {
            flex-grow: 1;
        }
        .track-title {
            color: #ff2222;
            font-weight: bold;
            font-size: 15px;
            margin: 0 0 4px 0;
        }
        .track-artist {
            color: #aaa;
            font-size: 12px;
            margin: 0 0 4px 0;
        }
        .copyright-box {
            background: #160000;
            border: 1px dashed #ff0000;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #ff8888;
            font-family: monospace;
            margin-top: 5px;
        }
        .btn-dl {
            background: #1a1a1a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px;
            font-size: 11px;
            display: block;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema Z 🔺 Bóveda Sincronizada</h1>
            <div class="subtitle">Tierra de Mafia • Espejo Oficial 416Hz</div>
        </header>

        <div class="card" style="text-align: center;">
            <span class="badge">ESTADO: CONECTADO A TRACKS.JSON</span>
            <p style="font-size: 12px; color: #aaa; margin: 5px 0 0 0;">Los temas se actualizan automáticamente desde el repositorio central.</p>
        </div>

        <!-- CATÁLOGO CARGADO DESDE EL JSON COMPARTIDO -->
        <div class="card">
            <h3>🎧 Catálogo Oficial del Sistema Z</h3>
            <div id="vault-playlist">
                <p style="color:#888; font-size:12px; text-align:center;">Cargando frecuencia de la bóveda...</p>
            </div>
        </div>
    </div>

    <script>
        // Lectura directa y sincronizada del archivo tracks.json (Puente público / privado)
        fetch('./tracks.json?' + new Date().getTime())
            .then(response => response.json())
            .then(tracks => {
                const container = document.getElementById('vault-playlist');
                container.innerHTML = '';

                if (!tracks || tracks.length === 0) {
                    container.innerHTML = '<p style="color:#888; font-size:12px; text-align:center;">No hay temas registrados en el JSON.</p>';
                    return;
                }

                tracks.forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.innerHTML = `
                        <div class="track-header">
                            <img src="${track.cover || 'uploads/cover.jpg'}" class="track-cover" alt="Cover">
                            <div class="track-info">
                                <div class="track-title">🔥 ${track.title}</div>
                                <div class="track-artist">${track.artist} • <span style="color:#ff4444;">${track.freq || '416Hz'}</span></div>
                                <div class="copyright-box">🛡️ Copyright Z: ${track.copyright || 'Z-AUTH-416-OFFICIAL'}</div>
                            </div>
                        </div>
                        <audio controls src="${track.file}"></audio>
                        <a href="${track.file}" download class="btn-dl">📥 Descargar MP3 Oficial</a>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(error => {
                console.error("Error al cargar tracks.json:", error);
                document.getElementById('vault-playlist').innerHTML = '<p style="color:#ff4444; font-size:12px; text-align:center;">⚠️ Error al sincronizar con tracks.json</p>';
            });
    </script>
</body>
</html>
