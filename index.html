<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Z - Bóveda Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0b0b; color: #f1f1f1; font-family: monospace; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #141414; border: 2px solid #ff0033; border-radius: 10px; padding: 20px; box-shadow: 0 0 15px rgba(255, 0, 51, 0.2); }
        h2 { color: #ff0033; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 13px; }
        input, select { width: 100%; padding: 10px; background: #1f1f1f; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #ff0033; color: #fff; border: none; padding: 12px; font-weight: bold; font-size: 15px; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        button:hover { background: #d00028; }
        #logPantalla { background: #000; color: #0f0; padding: 12px; margin-top: 20px; font-size: 12px; border: 1px solid #0f0; border-radius: 5px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sistema Z 🔺 Bóveda</h2>
        <div class="form-group">
            <label>Artista:</label>
            <input type="text" id="artistaInput" value="Enyi el Científico">
        </div>
        <div class="form-group">
            <label>Título del Tema:</label>
            <input type="text" id="tituloInput" placeholder="Ej. El Canto de la Conexión">
        </div>
        <div class="form-group">
            <label>Género / Estilo:</label>
            <input type="text" id="generoInput" value="Dark Experimental Reggaeton">
        </div>
        <div class="form-group">
            <label>Archivo de Audio (.mp3 / .wav):</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>
        <button id="btnSubirZ" >Generar Coprin y Subir</button>
        <div id="logPantalla">🟢 Sistema Z: Conectado a Bóveda. Listo para operar.</div>
    </div>

    <script>
        // CONFIGURACIÓN OFICIAL SUPABASE - SISTEMA Z
        const SUPABASE_URL = 'https://tlvcwwrir2oaoai4f0ed.supabase.co'; 
        const SUPABASE_ANON_KEY = 'Sb_publishable_3i0NSPnUKz89ykUYcFiEDg_bq9Uaf9s';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logZ(mensaje) {
            const pantalla = document.getElementById('logPantalla');
            pantalla.innerHTML += '<br>> ' + mensaje;
            pantalla.scrollTop = pantalla.scrollHeight;
            console.log(mensaje);
        }

        async function procesarSubidaSistemaZ(e) {
            e.preventDefault();
            logZ('🚀 Iniciando protocolo de subida...');

            const titulo = document.getElementById('tituloInput').value || 'Tema_Sin_Nombre';
            const audioFile = document.getElementById('audioInput').files[0];

                alert('⚠️ Selecciona un archivo de audio primero.');
                logZ('❌ Error: Falta el archivo de audio.');
                return;
            }

            logZ('Cargando archivo: ' + audioFile.name);

            try {
                const timestamp = Date.now();
                const rutaAudio = 'audio/' + timestamp + '_' + audioFile.name;
                
                logZ('Empujando a Supabase [boveda-z]...');
                const { data, error } = await supabaseClient.storage
                    .from('boveda-z')
                    .upload(rutaAudio, audioFile);

                if (error) throw error;

                logZ('✅ ¡Tema guardado con éxito en boveda-z!');
                alert('¡Éxito total! Archivo subido a la bóveda.');
            } catch (err) {
                logZ('❌ Error de Supabase: ' + err.message);
                alert('Error: ' + err.message);
            }
        }
    </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btnSubirZ');
    if (btn) {
        console.log('Botón encontrado por el sistema.');
        btn.addEventListener('click', async (e) => {
            e.preventDefault();
            alert('🔥 ¡Clic detectado por el escuchador Z!');
            
            const titulo = document.getElementById('tituloInput').value || 'Tema_Sin_Nombre';
            const audioInput = document.getElementById('audioInput');
            
                alert('⚠️ Selecciona un archivo de audio primero.');
                return;
            }
            
            const audioFile = audioInput.files[0];
            alert('Subiendo archivo: ' + audioFile.name);
            
            const clienteSupabase = window.supabase.createClient(
                'https://tlvcwwrir2oaoai4f0ed.supabase.co',
                'Sb_publishable_3i0NSPnUKz89ykUYcFiEDg_bq9Uaf9s'
            );
            
            try {
                const ruta = 'audio/' + Date.now() + '_' + audioFile.name;
                const { data, error } = await clienteSupabase.storage
                    .from('boveda-z')
                    .upload(ruta, audioFile);
                    
                if (error) throw error;
                alert('✅ ¡Éxito total! Archivo subido a la boveda-z.');
            } catch (err) {
                alert('❌ Error de Supabase: ' + err.message);
            }
        });
    }
});
</script>
</body>
</html>
