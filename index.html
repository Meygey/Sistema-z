<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Z | Tierra de Mafia</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        h1 { color: #e60000; text-align: center; text-transform: uppercase; font-size: 20px; }
        .card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #e60000; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        .status { margin-top: 8px; font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <h1>Sistema Z 🔺</h1>
    <div class="card">
        <h3>🎛️ Carga Directa Soberana</h3>
        <input type="text" id="nombreArtista" placeholder="Nombre Artístico">
        <input type="text" id="nombreTema" placeholder="Título del Tema">
        <input type="file" id="archivoMedia" accept="audio/*,video/*">
        <button onclick="subirDirecto()">Subir a la Bóveda 🔺</button>
        <div id="status" class="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function subirDirecto() {
            const artista = document.getElementById('nombreArtista').value.trim();
            const titulo = document.getElementById('nombreTema').value.trim();
            const file = document.getElementById('archivoMedia').files[0];
            const status = document.getElementById('status');

            if (!artista || !titulo || !file) {
                alert("Llena los campos y selecciona un archivo.");
                return;
            }

            status.innerText = "Subiendo archivo...";
            
            const cleanName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
            const fileName = `media_${Date.now()}_${cleanName}`;
            const supabaseUrl = window.SUPABASE_CONFIG.url;
            const anonKey = window.SUPABASE_CONFIG.anonKey;
            const bucket = window.SUPABASE_CONFIG.bucketName;

            try {
                // Subida limpia por HTTP Fetch para evitar bloqueos JWS de la librería
                const res = await fetch(`${supabaseUrl}/storage/v1/object/${bucket}/${fileName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${anonKey}`,
                        'apikey': anonKey,
                        'x-upsert': 'true'
                    },
                    body: file
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText);
                }

                const publicUrl = `${supabaseUrl}/storage/v1/object/public/${bucket}/${fileName}`;
                const coprinId = "COPRIN-Z-" + Math.floor(100000 + Math.random() * 900000);

                // Guardar en base de datos
                const { createClient } = supabase;
                const _supabase = createClient(supabaseUrl, anonKey, { auth: { persistSession: false } });
                
                await _supabase.from('temas_z').insert([{
                    coprin_id: coprinId,
                    artista: artista,
                    titulo: titulo,
                    archivo_url: publicUrl,
                    genero: 'Urbano'
                }]);

                status.innerHTML = `¡Éxito! Coprin: <b>${coprinId}</b> 🔺`;
                alert(`¡Subido con éxito! Coprin: ${coprinId}`);

            } catch (e) {
                status.innerText = "Error: " + e.message;
                console.error(e);
            }
        }
    </script>
</body>
</html>
