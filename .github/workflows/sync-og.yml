name: Sync OG Pages

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync_temas_og.py
        run: python3 sync_temas_og.py

      - name: Commit and push updated /t/ files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync OG pages for temas_z"
            git push origin main
          fi
